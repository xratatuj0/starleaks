<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rejestracja - Starleaks</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth">
  <div class="auth-box">
    <h1>STARLEAKS</h1>
    <form id="regForm">
      <input type="text" placeholder="Imie" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Haslo" required>
      <button type="submit">Zarejestruj</button>
    </form>
    <p>Masz juz konto? <a href="/login">Zaloguj sie</a></p>
    <div id="msg"></div>
  </div>
  <script>
    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const [name, email, pwd] = e.target.querySelectorAll('input');
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.value, email: email.value, password: pwd.value })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.token = data.token;
        localStorage.user = JSON.stringify(data.user);
        location.href = '/';
      } else {
        document.getElementById('msg').textContent = data.error || 'Blad';
      }
    };
  </script>
</body>
</html>
